<script>
  /* O manifesto (nome + logo do app instalado) precisa entrar o quanto antes. */
  (function () {
    var b = (new URLSearchParams(location.search).get("b") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
    var C = window.CONFIG || {};
    if (!b || !C.SUPABASE_URL) return;
    var base = location.origin + location.pathname.replace(/[^/]*$/, "");
    var l = document.createElement("link");
    l.rel = "manifest";
    l.href = String(C.SUPABASE_URL).trim().replace(/\/+$/, "").replace(/\/(rest|auth|functions|storage)\/v1$/, "") + "/functions/v1/manifest?b=" + encodeURIComponent(b) + "&base=" + encodeURIComponent(base);
    document.head.appendChild(l);
  })();
</script>
</head>
